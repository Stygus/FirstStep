version: '3.8'

services:
  firststep-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENV_FILE: .env
    ports:
      - "8080:80"
    container_name: firststep-flutter-web
    restart: unless-stopped
    env_file:
      - .env     
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - FirstStep

networks:
  FirstStep:
    driver: bridge
